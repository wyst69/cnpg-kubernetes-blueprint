# Scrapes the operator's own controller-runtime metrics (reconcile counts,
# webhook requests) — the operator ships a `metrics` port (8080) but nothing
# in this lab pointed Prometheus at it, so the CloudNativePG dashboard's
# "Operator" panels never had data, in either workload cluster.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-controller-manager
  namespace: cnpg-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  podMetricsEndpoints:
    - port: metrics
