        - hit_ratio:
            usage: "GAUGE"
            description: "100 * shared_blks_hit / (shared_blks_hit + shared_blks_read); null when the statement has no shared block activity at all"
      target_databases:
        - 'postgres'

    pg_stat_statements_top_wal:
      query: |
        SELECT
          pss.queryid,
          d.datname,
          r.rolname AS usename,
          pg_catalog.left(pss.query, 100) AS query,
          pss.calls,
          pss.total_exec_time,
          pss.mean_exec_time,
          pss.stddev_exec_time,
          pss.rows,
          pss.shared_blks_hit,
          pss.shared_blks_read,
          pss.shared_blks_dirtied,
          pss.shared_blks_written,
          pss.temp_blks_read,
          pss.temp_blks_written,
          pss.wal_bytes,
          100.0 * pss.shared_blks_hit / NULLIF(pss.shared_blks_hit + pss.shared_blks_read, 0) AS hit_ratio
        FROM pg_stat_statements pss
        JOIN pg_catalog.pg_database d ON d.oid = pss.dbid
        JOIN pg_catalog.pg_roles r ON r.oid = pss.userid
        WHERE r.rolname NOT IN ('cnpg_metrics_exporter', 'streaming_replica')
        ORDER BY pss.wal_bytes DESC NULLS LAST
        LIMIT 20
      metrics:
        - queryid:
            usage: "LABEL"
            description: "Stable identifier for the normalized statement -- the real join/uniqueness key, since truncated query text can collide"
        - datname:
            usage: "LABEL"
            description: "Database the statement ran against"
        - usename:
            usage: "LABEL"
            description: "Role that ran the statement"
        - query:
            usage: "LABEL"
            description: "Normalized statement text, truncated to 100 characters -- use pgstat.sql for the full text"
        - calls:
            usage: "COUNTER"
            description: "Number of times executed since stats were last reset"
        - total_exec_time:
            usage: "COUNTER"
            description: "Total time spent executing this statement, in milliseconds"
        - mean_exec_time:
            usage: "GAUGE"
            description: "Mean execution time per call, in milliseconds"
        - stddev_exec_time:
            usage: "GAUGE"
            description: "Standard deviation of execution time -- flags inconsistent, not just slow, statements"
        - rows:
            usage: "COUNTER"
            description: "Total rows retrieved or affected"
        - shared_blks_hit:
            usage: "COUNTER"
            description: "Shared buffer blocks hit"
        - shared_blks_read:
            usage: "COUNTER"
            description: "Shared buffer blocks read from disk"
        - shared_blks_dirtied:
            usage: "COUNTER"
            description: "Shared buffer blocks dirtied"
        - shared_blks_written:
            usage: "COUNTER"
            description: "Shared buffer blocks written out"
        - temp_blks_read:
            usage: "COUNTER"
            description: "Temp file blocks read -- non-zero means this statement is spilling to disk"
        - temp_blks_written:
            usage: "COUNTER"
            description: "Temp file blocks written -- non-zero means this statement is spilling to disk"
        - wal_bytes:
            usage: "COUNTER"
            description: "Total WAL generated by this statement"
        - hit_ratio:
            usage: "GAUGE"
            description: "100 * shared_blks_hit / (shared_blks_hit + shared_blks_read); null when the statement has no shared block activity at all"
      target_databases:
        - 'postgres'
