---
# =============================================================================
# k3d_clusters — create the hub and the workload clusters on the shared network.
# =============================================================================

- name: List existing k3d clusters
  ansible.builtin.command: "k3d cluster list -o json"
  register: k3d_list
  changed_when: false

- name: Create k3d clusters
  ansible.builtin.command: >-
    k3d cluster create {{ item.name }}
    --servers {{ item.servers | default(1) }}
    --agents {{ item.agents | default(1) }}
    --network {{ lab_network }}
    --api-port {{ item.api_port }}
    --k3s-arg --disable=traefik@server:*
    --k3s-arg --tls-san=host.k3d.internal@server:*
    --k3s-arg --tls-san={{ host_ip }}@server:*
    {% if item.name == hub_cluster.name %}
    {% for p in hub_published_ports %} --port {{ hub_publish_address }}:{{ p.host }}:{{ p.node }}@loadbalancer{% endfor %}
    {% endif %}
  loop: "{{ all_clusters }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in (k3d_list.stdout | from_json | map(attribute='name') | list)

- name: Merge the k3d kubeconfigs into the lab user's ~/.kube/config
  ansible.builtin.command: >-
    k3d kubeconfig merge --all --output {{ lab_user_home }}/.kube/config
  changed_when: false

- name: Set ownership and permissions on ~/.kube/config
  ansible.builtin.file:
    path: "{{ lab_user_home }}/.kube/config"
    owner: "{{ lab_user }}"
    group: "{{ lab_group }}"
    mode: "0600"

- name: Wait for every cluster's API server to answer
  ansible.builtin.command: "kubectl --context {{ item.context }} get --raw /readyz"
  register: api_ready
  until: api_ready.rc == 0
  retries: 30
  delay: 5
  changed_when: false
  loop: "{{ all_clusters }}"
  loop_control:
    label: "{{ item.context }}"

- name: Read the hub cluster's current CoreDNS Corefile
  ansible.builtin.command: >-
    kubectl --context {{ hub_cluster.context }} get configmap coredns -n kube-system
    -o jsonpath={.data.Corefile}
  register: hub_corefile
  changed_when: false

# k3d injects host.k3d.internal into CoreDNS at cluster-create time, but k3s's
# own node-hosts reconciler overwrites the same NodeHosts file on every node
# restart and drops it — breaking Vault's kubernetes-auth callback into the
# workload clusters' API servers after any crash/reboot. Bake the entry into
# the `hosts` block itself instead of NodeHosts so it survives that.
- name: Fix host.k3d.internal so it survives a node restart
  when: "'host.k3d.internal' not in hub_corefile.stdout"
  vars:
    # Real newline from a YAML double-quoted scalar; '\n' inside a Jinja string
    # is not reliably decoded across ansible-core versions.
    nl: "\n"
  block:
    - name: Render the patched Corefile
      ansible.builtin.copy:
        dest: /tmp/hub-coredns-corefile
        content: >-
          {{ hub_corefile.stdout
             | replace('hosts /etc/coredns/NodeHosts {',
                        'hosts /etc/coredns/NodeHosts {' ~ nl ~ '      ' ~ lab_gateway ~ ' host.k3d.internal') }}

    - name: Render the patched ConfigMap manifest
      ansible.builtin.command: >-
        kubectl --context {{ hub_cluster.context }} create configmap coredns -n kube-system
        --from-file=Corefile=/tmp/hub-coredns-corefile
        --dry-run=client -o yaml
      register: hub_coredns_cm
      changed_when: false

    - name: Write the ConfigMap manifest
      ansible.builtin.copy:
        dest: /tmp/hub-coredns-cm.yaml
        content: "{{ hub_coredns_cm.stdout }}"

    - name: Apply the patched ConfigMap
      ansible.builtin.command: >-
        kubectl --context {{ hub_cluster.context }} apply -f /tmp/hub-coredns-cm.yaml
      changed_when: true

    - name: Restart CoreDNS to pick up the patched Corefile
      ansible.builtin.command: >-
        kubectl --context {{ hub_cluster.context }} rollout restart deployment coredns -n kube-system
      changed_when: true

    - name: Wait for the CoreDNS rollout
      ansible.builtin.command: >-
        kubectl --context {{ hub_cluster.context }} rollout status deployment coredns -n kube-system --timeout=60s
      changed_when: false

    - name: Clean up scratch files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/hub-coredns-corefile
        - /tmp/hub-coredns-cm.yaml

- name: Taint the workload clusters' server nodes as control-plane-only
  ansible.builtin.command: >-
    kubectl taint node --context {{ item.context }}
    -l node-role.kubernetes.io/control-plane
    node-role.kubernetes.io/control-plane:NoSchedule
    --overwrite
  register: server_taint
  changed_when: "'tainted' in server_taint.stdout"
  loop: "{{ clusters }}"
  loop_control:
    label: "{{ item.context }}"
