---
# =============================================================================
# Teardown Playbook for CNPG Cross-Cluster Lab
#
# Reverses all changes made by full-lab-setup.yaml.
# Fully idempotent and safe to re-run.
#
# USAGE:
#   Local:  ansible-playbook teardown-lab.yaml
#   Remote: ansible-playbook -i inventory.ini teardown-lab.yaml -e target=docker_host
#   Bypass confirmation: add -e confirm=yes
# =============================================================================
- name: Teardown CNPG cross-cluster lab
  hosts: "{{ target | default('localhost') }}"
  gather_facts: true

  vars_prompt:
    - name: confirm
      prompt: "This DELETES all k3d clusters, SigNoz stack, Vault/MinIO containers, volumes, and local keys. Type 'yes' to proceed"
      private: false

  vars:
    vault_container: external-vault
    minio_container: minio-s3
    lab_network: multi-cluster-net
    clusters:
      - name: cluster-a
      - name: cluster-b

  pre_tasks:
    - name: Require explicit confirmation
      ansible.builtin.assert:
        that: confirm | lower == 'yes'
        fail_msg: "Teardown aborted (confirmation was not 'yes')."
        success_msg: "Confirmed — starting complete lab teardown."

  tasks:
    # ========================================================================
    # STEP 1 — Delete k3d Kubernetes Clusters
    # ========================================================================
    - name: List existing k3d clusters
      ansible.builtin.command: "k3d cluster list -o json"
      register: k3d_list
      changed_when: false
      failed_when: false

    - name: Delete k3d clusters
      ansible.builtin.command: "k3d cluster delete {{ item.name }}"
      loop: "{{ clusters }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - k3d_list.rc == 0
        - item.name in (k3d_list.stdout | default('[]') | from_json | map(attribute='name') | list)

    # ========================================================================
    # STEP 2 — Tear Down SigNoz Stack (prod_otlp profile cleanup)
    # ========================================================================
    - name: Check if SigNoz Docker Compose deployment directory exists
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/signoz/pours/deployment"
      register: signoz_dir

    - name: Stop and remove SigNoz Docker Compose containers
      community.docker.docker_compose_v2:
        project_src: "{{ ansible_facts['env']['HOME'] }}/signoz/pours/deployment"
        state: absent
        remove_volumes: true
      when: signoz_dir.stat.exists

    # ========================================================================
    # STEP 3 — Remove Shared Containers, Volumes & Network
    # ========================================================================
    - name: Remove external Vault and MinIO containers
      ansible.builtin.command: "docker rm -f {{ item }}"
      loop:
        - "{{ vault_container }}"
        - "{{ minio_container }}"
      failed_when: false
      changed_when: true

    - name: Remove persistent Docker volumes
      ansible.builtin.command: "docker volume rm {{ item }}"
      loop:
        - vault-data
        - minio-data
      failed_when: false
      changed_when: true

    - name: Remove shared Docker network
      ansible.builtin.command: "docker network rm {{ lab_network }}"
      failed_when: false
      changed_when: true

    # ========================================================================
    # STEP 4 — Clean Up Local Files, Binaries & ~/.bashrc
    # ========================================================================
    - name: Remove Ansible managed block from ~/.bashrc
      ansible.builtin.blockinfile:
        path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
        marker: "# {mark} ANSIBLE MANAGED BLOCK: LAB CLI ENVS"
        state: absent

    - name: Remove generated key files and temporary build directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ ansible_facts['env']['HOME'] }}/.vault-keys.json"
        - "{{ ansible_facts['env']['HOME'] }}/signoz"
        - "/tmp/csi-driver-host-path"
        - "/tmp/foundry.sh"
        - "/tmp/ca-cluster-a.crt"
        - "/tmp/ca-cluster-b.crt"

    # ========================================================================
    # STEP 5 — Clean Up Helm Repositories (Optional)
    # ========================================================================
    - name: List installed Helm repositories
      ansible.builtin.command: "helm repo list -o json"
      register: helm_repos
      failed_when: false
      changed_when: false

    - name: Remove lab Helm repositories
      ansible.builtin.command: "helm repo remove {{ item }}"
      loop:
        - external-secrets
        - open-telemetry
      when:
        - helm_repos.rc == 0
        - item in (helm_repos.stdout | default('[]') | from_json | map(attribute='name') | list)
      failed_when: false

    - name: Teardown summary
      ansible.builtin.debug:
        msg: "Lab environment has been completely torn down. Ready to re-deploy!"
