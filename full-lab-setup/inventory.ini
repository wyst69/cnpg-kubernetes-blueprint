# Inventory for the CNPG cross-cluster lab playbooks.
#
# Only needed to target a REMOTE Docker host. For a LOCAL host you don't need
# this file at all:
#   ansible-playbook site.yml -e host_ip=<HOST_IP>
#
# For a remote host: edit the entry below (name / ansible_host / ansible_user),
# then select the group with -e target:
#   ansible-playbook site.yml     -e target=docker_host -e host_ip=<HOST_IP>
#   ansible-playbook teardown.yml -e target=docker_host -e confirm=yes
#
# Notes:
#   - host_ip auto-detects from the remote host's default route; override with
#     -e host_ip=<HOST_IP> if that host is multi-homed and picks the wrong NIC.
#   - The iptables/sysctl/apt tasks need root on the Docker host, hence
#     ansible_become=true.

[docker_host]
# Replace with your host. If plain `ssh <name>` already works (via ~/.ssh/config
# or /etc/hosts), drop ansible_host/ansible_user and just list the name.
lab-host ansible_host=CHANGE_ME.example.com ansible_user=CHANGE_ME

[docker_host:vars]
# NOTE: deliberately no `ansible_become=true` here.
#
# The roles declare `become: true` on exactly the tasks that need root (iptables,
# sysctl, apt, the mc download). Escalating the whole play instead has real side
# effects: docker/k3d/kubectl/helm/mc all run as root, so Helm repositories land
# in /root/.config/helm and the mc alias in /root/.mc — invisible when you later
# run those commands yourself.
#
# The connecting user therefore needs:
#   - membership of the `docker` group (for docker and k3d)
#   - passwordless sudo, or run with --ask-become-pass
# ansible_become_password=...   # or run with --ask-become-pass
