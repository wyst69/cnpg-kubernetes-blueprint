apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-pruner
  namespace: default

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnpg-pruner
  namespace: default
rules:
- apiGroups: ["snapshot.storage.k8s.io"]
  resources: ["volumesnapshots"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: ["postgresql.cnpg.io"]
  resources: ["backups"]
  verbs: ["get", "list", "watch", "delete"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnpg-pruner
  namespace: default
subjects:
- kind: ServiceAccount
  name: cnpg-pruner
roleRef:
  kind: Role
  name: cnpg-pruner
  apiGroup: rbac.authorization.k8s.io
